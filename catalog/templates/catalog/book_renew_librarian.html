{% extends "base_generic.html" %}
{% block content %}

    <h1>Продлить книгу: </h1>
    <h2>{{bookinst.book.title}}</h2>
    <br>
    <p><b>Читатель: </b>{{bookinst.borrower}}</p>
    <p{% if bookinst.is_overdue %} class="text-danger"{% endif %}><b>Вернуть до: </b>{{bookinst.due_back}}</p>

    <form action="" method="post">
        {% csrf_token %}
        <table>
        {{ form }}
        </table>
        <input type="submit" value="Submit" />
    </form>

{% endblock %}
