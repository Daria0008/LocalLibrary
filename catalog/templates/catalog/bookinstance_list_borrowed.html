{% extends "base_generic.html" %}

{% block content %}

    {% if perms.catalog.can_mark_returned %}
      <h1>Книги на руках у читателей</h1>
      <ol>
        {% for book in borrowed %}
          <li> {{ book.borrower }}, <a href="{{ book.book.get_absolute_url }}">{{ book.book.title }}</a>, {{book.due_back}}</li>
        {% endfor %}
      </ol>
    {% endif %}

{% endblock %}
